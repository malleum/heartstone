# Minimal config for the invisible render compositor (see tools/render.sh).
# Room for four renders side by side (tools/place.py keeps them from covering each other).
output HEADLESS-1 resolution 5120x2880
for_window [app_id=".*"] floating enable
# A new window must not take focus: when two renders overlap, the first one losing
# focus has Godot let go of every held key and button, and a scripted run (ghost.sh)
# loses its presses (that was the "one run in four" flake).
no_focus [app_id=".*"]
focus_on_window_activation none
default_border none
exec sh -c 'echo $WAYLAND_DISPLAY > $XDG_RUNTIME_DIR/heartstone-sway.display'
